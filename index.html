<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/js/inicio.js" defer></script>
    <link rel="icon" type="image/png" href="/imagenes/logo1.png" />
    <title>QuizMaster</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="navbar">

        <div class="logo">

            <div class="logo">
                <span class="logo-icon">Q</span>
                <span class="nombre-logo">QuizMaster</span>
            </div>

        </div>

    </header>

    <main class="inicio">

        <div class="etiqueta">
            ¡BIENVENIDO AL JUEGO DE TRIVIA SUPREMO!
        </div>

        <h1>
            Pon a prueba tu
            mente con<br>
            <span>QuizMaster</span>
        </h1>

        <p class="subtitulo">
            ¿Cuánto sabes? ¡Demuéstralo!
        </p>

        <div class="tarjeta">

            <label for="nombre">
                Tu nombre o nickname
            </label>

            <div class="input-container">
                <input type="text" id="nombre" placeholder="Introduce tu nombre">

            </div>

            <button id="btnIniciar">
                Iniciar Juego
            </button>

        </div>

    </main>

</body>

</html>
