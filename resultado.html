<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/resultadoJuego.js" defer></script>
    <title>QuizMaster - Resultado</title>
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <main class="resultado">

        <div class="resultado-final">
            <h2>Concurso finalizado</h2>

            <p>
                Jugador:
                <strong id="resultadoNombre"></strong>
            </p>

            <div class="resultado-datos">

                <p>
                    Preguntas acertadas:
                    <strong id="resultadoCorrectas"></strong>
                </p>

                <p>
                    Preguntas falladas:
                    <strong id="resultadoIncorrectas"></strong>
                </p>
            </div>

            <h3 id="resultadoFinal"></h3>

        </div>

    </main>

</body>

</html>
